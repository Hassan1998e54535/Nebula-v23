  unfurl-shard:
    <<: *nexus-service
    image: ${NEXUS_REGISTRY:-ghcr.io/${NEXUS_REGISTRY_OWNER:-hassan1998e54535}}/nexus-unfurl:${NEXUS_IMAGE_TAG:-v1}
    deploy:
