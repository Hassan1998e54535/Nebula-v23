x-nexus-service: &nexus-service
  restart: ${NEXUS_RESTART_POLICY:-unless-stopped}
  networks: [fluxer]

x-nexus-app-healthcheck: &nexus-app-healthcheck
  interval: ${NEXUS_HEALTHCHECK_INTERVAL:-10s}
  timeout: ${NEXUS_HEALTHCHECK_TIMEOUT:-5s}
  retries: ${NEXUS_APP_HEALTHCHECK_RETRIES:-30}
  start_period: ${NEXUS_APP_HEALTHCHECK_START_PERIOD:-90s}
  start_interval: 1s

x-nexus-svc-healthcheck: &nexus-svc-healthcheck
  <<: *nexus-app-healthcheck
  start_period: ${NEXUS_SVC_HEALTHCHECK_START_PERIOD:-60s}
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET /_health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]

services:
  edge:
    <<: *nexus-service
    image: ${NEXUS_CADDY_IMAGE:-caddy:2.11-alpine}
    deploy:
      resources:
        limits:
          memory: ${NEXUS_CADDY_MEMORY_LIMIT:-256mb}
    ports:
      - "${NEXUS_HTTP_PORT:-80}:80"
      - "${NEXUS_HTTPS_PORT:-443}:443"
      - "${NEXUS_HTTPS_PORT:-443}:443/udp"
    environment:
      NEXUS_EDGE_SITE_ADDRESS: ${NEXUS_EDGE_SITE_ADDRESS:-${NEXUS_CADDY_SITE_ADDRESS:-${NEXUS_PUBLIC_SCHEME:-https}://${NEXUS_DOMAIN:?set NEXUS_DOMAIN in .env}}}
      NEXUS_EDGE_TRUSTED_PROXIES: ${NEXUS_EDGE_TRUSTED_PROXIES:-private_ranges}
      NEXUS_EDGE_ENCODE: ${NEXUS_EDGE_ENCODE:-zstd gzip}
      NEXUS_EDGE_GLOBAL_OPTIONS: ${NEXUS_EDGE_GLOBAL_OPTIONS:-}
      NEXUS_ADMIN_BASE_PATH: ${NEXUS_ADMIN_BASE_PATH:-/admin}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - edge-data:/data
      - edge-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: ${NEXUS_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${NEXUS_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${NEXUS_HEALTHCHECK_RETRIES:-10}
    depends_on:
      api: {condition: service_started}
      gateway: {condition: service_healthy}
      media-proxy: {condition: service_started}
      static-proxy: {condition: service_started}
      admin: {condition: service_started}

  postgres:
    <<: *nexus-service
    image: ${NEXUS_POSTGRES_IMAGE:-postgres:16-alpine}
    deploy:
      resources:
        limits:
          memory: ${NEXUS_POSTGRES_MEMORY_LIMIT:-5gb}
        reservations:
          memory: ${NEXUS_POSTGRES_MEMORY_RESERVATION:-3gb}
    command: >
      postgres
      -c max_connections=${NEXUS_POSTGRES_SERVER_MAX_CONNECTIONS:-150}
      -c shared_buffers=${NEXUS_POSTGRES_SHARED_BUFFERS:-512MB}
      -c effective_cache_size=${NEXUS_POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}
      -c work_mem=${NEXUS_POSTGRES_WORK_MEM:-8MB}
      -c maintenance_work_mem=${NEXUS_POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
      -c autovacuum_work_mem=${NEXUS_POSTGRES_AUTOVACUUM_WORK_MEM:-128MB}
      -c random_page_cost=${NEXUS_POSTGRES_RANDOM_PAGE_COST:-1.1}
      -c effective_io_concurrency=${NEXUS_POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}
      -c default_statistics_target=${NEXUS_POSTGRES_DEFAULT_STATISTICS_TARGET:-200}
      -c jit=${NEXUS_POSTGRES_JIT:-off}
      -c min_wal_size=${NEXUS_POSTGRES_MIN_WAL_SIZE:-512MB}
      -c max_wal_size=${NEXUS_POSTGRES_MAX_WAL_SIZE:-2GB}
      -c checkpoint_completion_target=${NEXUS_POSTGRES_CHECKPOINT_COMPLETION_TARGET:-0.9}
      -c wal_buffers=${NEXUS_POSTGRES_WAL_BUFFERS:-16MB}
