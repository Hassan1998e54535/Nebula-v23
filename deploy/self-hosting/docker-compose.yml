      start_period: ${NEXUS_SEAWEEDFS_HEALTHCHECK_START_PERIOD:-60s}

  seaweedfs-init:
    image: ${NEXUS_SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.47}
    deploy:
      resources:
        limits:
          memory: ${NEXUS_SEAWEEDFS_INIT_MEMORY_LIMIT:-128mb}
    networks: [fluxer]
    depends_on:
      seaweedfs: {condition: service_healthy}
    restart: "no"
    environment:
      NEXUS_S3_ACCESS_KEY: ${NEXUS_S3_ACCESS_KEY:?set NEXUS_S3_ACCESS_KEY in .env}
      NEXUS_S3_SECRET_KEY: ${NEXUS_S3_SECRET_KEY:?set NEXUS_S3_SECRET_KEY in .env}
      NEXUS_S3_BUCKET_CDN: ${NEXUS_S3_BUCKET_CDN:-fluxer}
      NEXUS_S3_BUCKET_UPLOADS: ${NEXUS_S3_BUCKET_UPLOADS:-fluxer-uploads}
      NEXUS_S3_BUCKET_REPORTS: ${NEXUS_S3_BUCKET_REPORTS:-fluxer-reports}
      NEXUS_S3_BUCKET_HARVESTS: ${NEXUS_S3_BUCKET_HARVESTS:-fluxer-harvests}
      NEXUS_SEAWEEDFS_INIT_ATTEMPTS: ${NEXUS_SEAWEEDFS_INIT_ATTEMPTS:-60}
    entrypoint:
      - /bin/sh
      - -c
      - >
        buckets="$$NEXUS_S3_BUCKET_CDN $$NEXUS_S3_BUCKET_UPLOADS $$NEXUS_S3_BUCKET_REPORTS $$NEXUS_S3_BUCKET_HARVESTS";
        missing="$$buckets";
        for attempt in $$(seq 1 $$NEXUS_SEAWEEDFS_INIT_ATTEMPTS); do
          if ! nc -z seaweedfs 9333 2>/dev/null; then
            sleep 2;
            continue;
          fi;
          listed=$$(echo "s3.bucket.list" | timeout 10 weed shell -master=seaweedfs:9333 2>&1);
          missing="";
          for b in $$buckets; do
            echo "$$listed" | grep -q "^[[:space:]]*$$b[[:space:]]" || missing="$${missing:+$$missing }$$b";
          done;
          if [ -z "$$missing" ]; then
            if ! echo "s3.configure -user=fluxer -access_key=$$NEXUS_S3_ACCESS_KEY -secret_key=$$NEXUS_S3_SECRET_KEY -actions=Admin,Read,Write,List,Tagging -apply" | timeout 10 weed shell -master=seaweedfs:9333 >/dev/null 2>&1; then
              echo "seaweedfs-init could not configure the S3 identity" >&2;
              exit 1;
            fi;
            echo "buckets ready";
            exit 0;
          fi;
          for b in $$missing; do
            echo "s3.bucket.create -name $$b" | timeout 10 weed shell -master=seaweedfs:9333 >/dev/null 2>&1;
          done;
          sleep 2;
        done;
        echo "seaweedfs-init could not verify buckets: $$missing" >&2;
        exit 1;

