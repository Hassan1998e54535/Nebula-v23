          memory: ${NEXUS_GIFS_SHARD_MEMORY_LIMIT:-256mb}
    environment:
      <<: *nexus-env
      NEXUS_SVC_NAME: gifs
      NEXUS_SVC_MODE: shard
      NEXUS_SVC_SHARD_ID: "0"
      NEXUS_GIFS_SHARD_CACHE_MAX_BYTES: ${NEXUS_GIFS_SHARD_CACHE_MAX_BYTES:-}
    healthcheck: *nexus-svc-healthcheck
    depends_on:
