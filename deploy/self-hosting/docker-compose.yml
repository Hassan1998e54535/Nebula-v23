  admin:
    <<: *nexus-service
    image: ${NEXUS_REGISTRY:-ghcr.io/${NEXUS_REGISTRY_OWNER:-hassan1998e54535}}/nexus-admin:${NEXUS_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${NEXUS_ADMIN_MEMORY_LIMIT:-256mb}
    environment:
      <<: *nexus-env
      NEXUS_ADMIN_PORT: "8080"
      NEXUS_ADMIN_BASE_PATH: ${NEXUS_ADMIN_BASE_PATH:-/admin}
      NEXUS_API_ENDPOINT: http://api:8080
      NEXUS_STATIC_CDN_ENDPOINT: ${NEXUS_STATIC_CDN_ENDPOINT:-${NEXUS_PUBLIC_ORIGIN:-${NEXUS_PUBLIC_SCHEME:-https}://${NEXUS_DOMAIN}}}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /_health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
