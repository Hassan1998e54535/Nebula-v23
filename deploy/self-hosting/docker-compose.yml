      NEXUS_PUSH_FCM_APPS: ${NEXUS_PUSH_FCM_APPS:-}
    healthcheck:
      test: ["CMD", "/usr/local/bin/nexus-push", "healthcheck"]
      <<: *nexus-app-healthcheck
      start_period: ${NEXUS_SVC_HEALTHCHECK_START_PERIOD:-60s}
    depends_on:
      nats: {condition: service_healthy}
      api: {condition: service_healthy}

  static-proxy:
    <<: *nexus-service
    image: ${NEXUS_REGISTRY:-ghcr.io/${NEXUS_REGISTRY_OWNER:-hassan1998e54535}}/nexus-static:${NEXUS_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${NEXUS_STATIC_PROXY_MEMORY_LIMIT:-256mb}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/avatars/0.png"]
      interval: ${NEXUS_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${NEXUS_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${NEXUS_HEALTHCHECK_RETRIES:-10}
    volumes:
      - ../../nexus_static:/srv/nexus-static:ro

  app-proxy:
    <<: *nexus-service
    image: ${NEXUS_REGISTRY:-ghcr.io/${NEXUS_REGISTRY_OWNER:-hassan1998e54535}}/nexus-app-proxy-self-hosted:${NEXUS_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${NEXUS_APP_PROXY_MEMORY_LIMIT:-256mb}
    environment:
      RUST_LOG: ${RUST_LOG:-}
      NEXUS_APP_PROXY_PORT: "8080"
      NEXUS_S3_PUBLIC_ENDPOINT: ${NEXUS_S3_PUBLIC_ENDPOINT:-}
      NEXUS_S3_BUCKET_UPLOADS: ${NEXUS_S3_BUCKET_UPLOADS:-}
      NEXUS_STATIC_CDN_ENDPOINT: ${NEXUS_STATIC_CDN_ENDPOINT:-}
      NEXUS_MEDIA_ENDPOINT: ${NEXUS_MEDIA_ENDPOINT:-}
      NEXUS_APP_PRODUCT_NAME: ${NEXUS_APP_PRODUCT_NAME:-}
      NEXUS_APP_ICON_URL: ${NEXUS_APP_ICON_URL:-}
      NEXUS_APP_SYMBOL_URL: ${NEXUS_APP_SYMBOL_URL:-}
      NEXUS_APP_LOGO_URL: ${NEXUS_APP_LOGO_URL:-}
      NEXUS_APP_WORDMARK_URL: ${NEXUS_APP_WORDMARK_URL:-}
      NEXUS_APP_FAVICON_URL: ${NEXUS_APP_FAVICON_URL:-}
      NEXUS_APP_THEME_COLOR: ${NEXUS_APP_THEME_COLOR:-}
      DISCOVERY_UPSTREAM_URL: http://edge:8088/.well-known/nexus
      DISCOVERY_REFRESH_INTERVAL_MS: ${DISCOVERY_REFRESH_INTERVAL_MS:-}
      NEXUS_APP_PROXY_INDEX_UPSTREAM_URL: ${NEXUS_APP_PROXY_INDEX_UPSTREAM_URL:-}
      NEXUS_APP_PROXY_SAME_ORIGIN_HOSTS: ${NEXUS_APP_PROXY_SAME_ORIGIN_HOSTS:-}
      NEXUS_APP_PROXY_MANIFEST_SCOPE_EXTENSIONS: ${NEXUS_APP_PROXY_MANIFEST_SCOPE_EXTENSIONS:-}
      NEXUS_CSP_EXTRA_DEFAULT_SRC: ${NEXUS_CSP_EXTRA_DEFAULT_SRC:-}
      NEXUS_CSP_EXTRA_CONNECT_SRC: ${NEXUS_CSP_EXTRA_CONNECT_SRC:-}
      NEXUS_CSP_EXTRA_IMG_SRC: ${NEXUS_CSP_EXTRA_IMG_SRC:-}
      NEXUS_CSP_EXTRA_MEDIA_SRC: ${NEXUS_CSP_EXTRA_MEDIA_SRC:-}
      NEXUS_CSP_EXTRA_FONT_SRC: ${NEXUS_CSP_EXTRA_FONT_SRC:-}
      NEXUS_CSP_EXTRA_SCRIPT_SRC: ${NEXUS_CSP_EXTRA_SCRIPT_SRC:-}
      NEXUS_CSP_EXTRA_STYLE_SRC: ${NEXUS_CSP_EXTRA_STYLE_SRC:-}
      NEXUS_CSP_EXTRA_FRAME_SRC: ${NEXUS_CSP_EXTRA_FRAME_SRC:-}
      NEXUS_CSP_EXTRA_WORKER_SRC: ${NEXUS_CSP_EXTRA_WORKER_SRC:-}
      NEXUS_CSP_EXTRA_MANIFEST_SRC: ${NEXUS_CSP_EXTRA_MANIFEST_SRC:-}
      NEXUS_CSP_REPORT_URI: ${NEXUS_CSP_REPORT_URI:-}
    volumes:
      - ./app-static:/srv/app/static:ro
    depends_on:
      api: {condition: service_healthy}
      edge: {condition: service_healthy}

  snowflakes:
    <<: *nexus-service
    image: ${NEXUS_REGISTRY:-ghcr.io/${NEXUS_REGISTRY_OWNER:-hassan1998e54535}}/nexus-snowflakes:${NEXUS_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${NEXUS_SNOWFLAKES_MEMORY_LIMIT:-128mb}
    environment:
      <<: *nexus-env
      NEXUS_SVC_NAME: snowflakes
      NEXUS_SVC_MODE: router
    healthcheck: *nexus-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}

  snowflakes-shard:
    <<: *nexus-service
    image: ${NEXUS_REGISTRY:-ghcr.io/${NEXUS_REGISTRY_OWNER:-hassan1998e54535}}/nexus-snowflakes:${NEXUS_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${NEXUS_SNOWFLAKES_SHARD_MEMORY_LIMIT:-256mb}
    environment:
      <<: *nexus-env
      NEXUS_SVC_NAME: snowflakes
      NEXUS_SVC_MODE: shard
      NEXUS_SVC_SHARD_ID: "0"
    healthcheck: *nexus-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}

  users:
    <<: *nexus-service
    image: ${NEXUS_REGISTRY:-ghcr.io/${NEXUS_REGISTRY_OWNER:-hassan1998e54535}}/nexus-users:${NEXUS_IMAGE_TAG:-v1}
