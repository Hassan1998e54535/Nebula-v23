    image: ${NEXUS_REGISTRY:-ghcr.io/${NEXUS_REGISTRY_OWNER:-hassan1998e54535}}/nexus-messages:${NEXUS_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${NEXUS_MESSAGES_MEMORY_LIMIT:-128mb}
    environment:
      <<: *nexus-env
      NEXUS_SVC_NAME: messages
      NEXUS_SVC_MODE: router
    healthcheck: *nexus-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}

  messages-shard:
    <<: *nexus-service
    image: ${NEXUS_REGISTRY:-ghcr.io/${NEXUS_REGISTRY_OWNER:-hassan1998e54535}}/nexus-messages:${NEXUS_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${NEXUS_MESSAGES_SHARD_MEMORY_LIMIT:-256mb}
    environment:
      <<: *nexus-env
      NEXUS_SVC_NAME: messages
      NEXUS_SVC_MODE: shard
      NEXUS_SVC_SHARD_ID: "0"
      NEXUS_POSTGRES_MAX_CONNECTIONS: "${NEXUS_MESSAGES_SHARD_POSTGRES_MAX_CONNECTIONS:-20}"
    healthcheck: *nexus-svc-healthcheck
    depends_on:
