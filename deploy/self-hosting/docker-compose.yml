    image: ${NEXUS_REGISTRY:-ghcr.io/${NEXUS_REGISTRY_OWNER:-hassan1998e54535}}/nexus-users:${NEXUS_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
