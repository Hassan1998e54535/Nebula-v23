    environment:
      <<: *nexus-env
      NEXUS_SVC_NAME: users
      NEXUS_SVC_MODE: shard
      NEXUS_SVC_SHARD_ID: "0"
      NEXUS_POSTGRES_MAX_CONNECTIONS: "${NEXUS_USERS_SHARD_POSTGRES_MAX_CONNECTIONS:-20}"
    healthcheck: *nexus-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}
      postgres: {condition: service_healthy}

  gifs:
    <<: *nexus-service
    image: ${NEXUS_REGISTRY:-ghcr.io/${NEXUS_REGISTRY_OWNER:-hassan1998e54535}}/nexus-gifs:${NEXUS_IMAGE_TAG:-v1}
